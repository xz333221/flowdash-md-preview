<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flowdash-md-preview demo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; height: 100vh; }
      .app { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
      .pane { min-width: 0; display: flex; flex-direction: column; }
      .pane + .pane { border-left: 1px solid #d8dee4; }
      textarea {
        flex: 1; padding: 16px; border: 0; resize: none; outline: none;
        font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.6;
      }
      #preview { flex: 1; padding: 0; overflow: hidden; }
      .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #d8dee4; }
      .bar button { padding: 4px 10px; cursor: pointer; }
      .outline { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid #d8dee4; background: #fafbfc; }
      .outline a { color: #57606a; font-size: 12px; text-decoration: none; }
      .outline a:hover { color: #0969da; text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="pane">
        <div class="bar"><strong>Markdown</strong></div>
        <textarea id="editor"></textarea>
      </div>
      <div class="pane">
        <div class="bar">
          <strong>Preview</strong>
          <label>主题
            <select id="theme">
              <optgroup label="基础主题">
                <option value="github">GitHub</option>
                <option value="github-dark">GitHub 深色</option>
                <option value="planet">Planet</option>
                <option value="notion">Notion</option>
                <option value="vuepress">VuePress</option>
                <option value="docusaurus">Docusaurus</option>
                <option value="bear">Bear</option>
                <option value="retro">Retro</option>
                <option value="latex">LaTeX</option>
                <option value="water-dark">Water 深色</option>
                <option value="sakura">Sakura</option>
                <option value="sakura-dark">Sakura 深色</option>
              </optgroup>
              <optgroup label="PhyCat 主题">
                <option value="phycat-forest">PhyCat 森绿</option>
                <option value="phycat-cherry">PhyCat 樱桃</option>
                <option value="phycat-sky">PhyCat 天蓝</option>
                <option value="phycat-sakura">PhyCat 樱花</option>
                <option value="phycat-mint">PhyCat 薄荷</option>
                <option value="phycat-mauve">PhyCat 淡紫</option>
                <option value="phycat-prussian">PhyCat 普鲁士</option>
                <option value="phycat-caramel">PhyCat 焦糖</option>
                <option value="phycat-abyss">PhyCat 深渊</option>
                <option value="phycat-radiation">PhyCat 辐射</option>
                <option value="phycat-vampire">PhyCat 吸血鬼</option>
              </optgroup>
            </select>
          </label>
        </div>
        <nav id="outline" class="outline" aria-label="文章目录"></nav>
        <div id="preview"></div>
      </div>
    </div>

    <!--
      先执行 `npm run build` 生成 dist/，再用浏览器打开本文件。
      浏览器无法解析裸模块名，所以这里用 importmap 把 markdown-it 指到 CDN，
      并把本地 dist 也映射进去。
    -->
    <script type="importmap">
      {
        "imports": {
          "markdown-it": "https://esm.sh/markdown-it@14",
          "../dist/": "../dist/"
        }
      }
    </script>
    <script type="module">
      import { createPreview, renderWithMetadata } from '../dist/index.js'

      const SAMPLE = `# flowdash-md-preview

一个**框架无关**的 Markdown 预览渲染器。

- 支持列表、表格、代码块
- 支持任务列表：- [x] 已完成
- 默认 \`linkify\`，裸链接 https://example.com 会自动变成 a 标签

\`\`\`ts
import { createPreview } from 'flowdash-md-preview'
const preview = createPreview('#preview')
preview.update('# Hello')
\`\`\`

> 左边输入，右边实时刷新。

| 选项 | 默认值 |
| --- | --- |
| \`breaks\` | \`true\` |
| \`html\` | \`false\` |
`

      const editor = document.getElementById('editor')
      const outline = document.getElementById('outline')
      const preview = createPreview('#preview', { initialValue: SAMPLE, headingId: true })
      editor.value = SAMPLE

      function refresh(value) {
        preview.update(value)
        const { headings } = renderWithMetadata(value, { headingId: true, className: false })
        outline.replaceChildren(...headings.flatMap((heading, index) => {
          const link = document.createElement('a')
          link.href = `#${heading.id}`
          link.style.marginLeft = `${(heading.level - 1) * 10}px`
          link.textContent = heading.text
          return index === 0 ? [link] : [document.createTextNode(' · '), link]
        }))
      }

      refresh(SAMPLE)
      editor.addEventListener('input', () => refresh(editor.value))

      document.getElementById('theme').addEventListener('change', (event) => {
        preview.setTheme(event.target.value)
      })

      // 便于在控制台里玩耍
      window.preview = preview
    </script>
  </body>
</html>
